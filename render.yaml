services:
  - type: web
    name: aire-kakao-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BACKEND_URL
        value: https://traip.mtvs2026.work
      - key: BEARER_TOKEN
        value: AIRE_WEB
      - key: SAVE_SLOT_ID
        value: demo-slot-1
      - key: COMPANION_ID
        value: mako
      - key: API_TIMEOUT_SECONDS
        value: 35
      - key: PORT
        value: 10000
      - key: KAKAO_SKILL_SECRET
        sync: false
